name: Refresh Belani Foundry

on:
  schedule:
    - cron: '0 23 * * *'   # 7am SGT
    - cron: '0 4 * * *'    # 12pm SGT
    - cron: '0 10 * * *'   # 6pm SGT
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser==6.0.11

      - name: Generate digest
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: cd news-digest && python3 run.py --html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./news-digest
          publish_branch: gh-pages
          keep_files: false
